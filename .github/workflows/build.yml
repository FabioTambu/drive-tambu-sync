name: Build Drive Tambu

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test
      - run: npm run typecheck
      - name: Verify standalone uninstall helper on Windows
        if: matrix.target == 'win'
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File build/uninstall-cleanup.ps1 -SelfTest
      - run: npm run dist:${{ matrix.target }}
      - name: Verify real SSH and private SFTP setup on disposable runner
        run: node -r ./tests/register.cjs tests/native/setup.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: drive-tambu-${{ matrix.target }}
          path: release/*
          if-no-files-found: error
          retention-days: 14
      - name: Upload sanitized setup report only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: setup-native-${{ matrix.target }}
          path: .setup-probe-results/*.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: drive-tambu-*
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
